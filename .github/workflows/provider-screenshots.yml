name: Provider simulation screenshots
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run screenshots:providers
      - run: npm run test:endurance
      - name: Encode 720p review clips as MP4
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          for clip in test-results/provider-screenshots/videos/*.webm; do
            ffmpeg -hide_banner -loglevel error -y -i "$clip" -an -c:v libx264 \
              -preset fast -crf 20 -pix_fmt yuv420p -movflags +faststart "${clip%.webm}.mp4"
          done
      - name: Verify match-day media and index the rehearsal
        run: node scripts/match-day-evidence.mjs
      - uses: actions/upload-artifact@v4
        id: evidence
        with:
          name: provider-screenshots-${{ github.sha }}
          path: |
            test-results/provider-screenshots/
            !test-results/provider-screenshots/videos/*.webm
          if-no-files-found: error
          retention-days: 30
      - name: Link review evidence
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          echo "Download the [commit-labelled rehearsal artifact]($ARTIFACT_URL) and open MATCH-DAY.md for programme stills, transitions and release times." >> "$GITHUB_STEP_SUMMARY"
